<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080d18">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex">
    <link rel="icon" href="https://teddashh.github.io/multi-ai-chat/assets/app-icon.png" type="image/png">
    <link rel="stylesheet" href="https://teddashh.github.io/multi-ai-chat/assets/styles.css">
    <title>Page not found — Multi-AI Chat</title>
  </head>
  <body class="not-found-page">
    <main class="not-found-shell">
      <a class="brand" href="https://teddashh.github.io/multi-ai-chat/" aria-label="Multi-AI Chat home" data-i18n-aria="homeAria">
        <img src="https://teddashh.github.io/multi-ai-chat/assets/app-icon.png" width="44" height="44" alt="">
        <strong>Multi-AI Chat</strong>
      </a>
      <p class="not-found-code">404 / NOT FOUND</p>
      <h1 data-i18n="notFoundTitle">That page wandered off.</h1>
      <p data-i18n="notFoundDesc">The address may have changed, but the official Multi-AI Chat site is still one click away.</p>
      <div class="hero-actions">
        <a class="button button-primary" href="https://teddashh.github.io/multi-ai-chat/" data-i18n="notFoundHome">Back to the official site</a>
        <a class="button button-secondary" href="https://github.com/teddashh/multi-ai-chat" data-i18n="notFoundGitHub">Open the GitHub repository</a>
      </div>
      <label class="language-control not-found-language">
        <span class="sr-only" data-i18n="languageLabel">Language</span>
        <select id="language-select" aria-label="Language" data-i18n-aria="languageLabel">
          <option value="en">English</option>
          <option value="zh-TW">繁體中文</option>
          <option value="ja">日本語</option>
          <option value="de">Deutsch</option>
          <option value="ko">한국어</option>
        </select>
      </label>
    </main>
    <script src="https://teddashh.github.io/multi-ai-chat/assets/site.js" defer></script>
  </body>
</html>
